<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineNocturno | Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
                <a class="marca" href="index.html">CineNocturno</a>
                <ul class="lista-menu d-flex flex-wrap gap-3 mb-0">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="fantasia.html">Fantasía oscura</a></li>
                    <li><a href="recomendaciones.html">Recomendaciones</a></li>
                    <li><a aria-current="page" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="encabezado">
            <div class="container py-4">
                <h1>Contacto</h1>
                <p>Recomienda una película para CineNocturno.</p>
            </div>
        </section>

        <section class="container seccion">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <form id="formularioContacto" class="formulario" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Tu nombre</label>
                            <input class="form-control campo-oscuro" id="nombre" name="nombre" type="text" minlength="2" maxlength="60" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input class="form-control campo-oscuro" id="correo" name="correo" type="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">¿Qué quieres compartir?</label>
                            <select class="form-select campo-oscuro" id="tipo" name="tipo" required>
                                <option value="">Selecciona una opción</option>
                                <option value="pelicula">Sugerir una película</option>
                                <option value="opinion">Compartir una opinión</option>
                                <option value="pregunta">Hacer una pregunta</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="pelicula" class="form-label">Nombre de la película</label>
                            <input class="form-control campo-oscuro" id="pelicula" name="pelicula" type="text" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="genero" class="form-label">Género</label>
                            <select class="form-select campo-oscuro" id="genero" name="genero" required>
                                <option value="">Selecciona un género</option>
                                <option value="fantasia">Fantasía oscura</option>
                                <option value="terror">Terror</option>
                                <option value="comedia">Comedia</option>
                                <option value="animacion">Animación gótica</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">¿Por qué la recomiendas?</label>
                            <textarea class="form-control campo-oscuro" id="mensaje" name="mensaje" rows="5" minlength="10" maxlength="300" aria-describedby="contador" required></textarea>
                            <small id="contador">0 de 300 caracteres</small>
                        </div>

                        <button class="btn boton-principal" type="submit">Enviar recomendación</button>
                        <p id="respuestaFormulario" class="mt-3" role="status" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="pie">
        <div class="container text-center">
            <p>CineNocturno</p>
            <p>©2026 CineNocturno</p>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
